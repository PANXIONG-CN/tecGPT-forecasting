model:
  _target_: src.tec_train.create_model
  model_name: tecGPT
  d_embed: 128
  d_llm: 768
  local_gpt2_path: /home/panxiong/tecGPT-forecasting/src/models/tecGPT/gpt2
  llm_layers_to_use: 2
  U_unfrozen_mha: 2
  dropout_embed: 0.1
  dropout_llm_out: 0.1
  enable_gradient_checkpointing_llm: false
dataset:
  data_dir: ./processed_tec_data
  scaler_path_template: '{data_version_dir}/scaler.pkl'
  num_nodes: 2911
  n_lat: 41
  n_lon: 71
  history_len: 12
  forecast_len: 12
  tec_feat_dim: 1
  sw_feat_dim: 5
  time_feat_dim: 6
  train_start_year: 2013
  train_start_month: 1
  train_end_year: 2021
  train_end_month: 12
  val_start_year: 2022
  val_start_month: 1
  val_end_year: 2023
  val_end_month: 6
  test_start_year: 2023
  test_start_month: 7
  test_end_year: 2025
  test_end_month: 4
  use_time_features: false
  version_id_template: tr{train_start_year_short}-{train_end_year_short}_v{val_start_year_short}-{val_end_year_short}_t{test_start_year_short}-{test_end_year_short}_h{history_len}_f{forecast_len}_{time_feat_flag}
trainer:
  batch_size: 2
  learning_rate: 0.0001
  epochs: 1
  patience: 10
  weight_decay: 0.01
  clip_grad_norm: 1.0
  print_every_epochs: 1
  optimizer_type: AdamW
  use_amp: true
sweeper:
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.OptunaSweeper
    storage: ${optuna_storage}
    study_name: ${optuna_study_name}
    n_jobs: 1
    direction: minimize
    n_trials: ${optuna_trials}
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${seed}
  params:
    trainer.learning_rate: loguniform(1e-5, 1e-3)
    model.d_embed: categorical(64, 128, 192)
    model.llm_layers_to_use: int(3, 6)
    model.U_unfrozen_mha: int(1, 3)
    trainer.optimizer_type: categorical('AdamW', 'Ranger')
project_name: tecGPT-forecasting
seed: 42
device: cuda
use_optuna: false
optuna_trials: 20
optuna_study_name: ${model.model_name}_study_${now:%Y%m%d_%H%M%S}
optuna_storage: sqlite:///./logs/${project_name}/optuna_studies/${optuna_study_name}.db
