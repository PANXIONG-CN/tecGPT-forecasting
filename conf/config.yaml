# conf/config.yaml
defaults:
  - model: tecGPT        # 默认模型
  - dataset: tec_data_basic # 默认使用基础配置（预处理时）或特定配置（训练时）
  - trainer: default     # 默认训练器配置
  - sweeper: basic_optuna # 默认Optuna配置 (如果使用)
  - _self_ # 允许在此文件中直接定义参数

# 实验全局参数
project_name: "tecGPT-forecasting"
seed: 42
device: "cuda" # 全局设备设置

# Hydra 配置
hydra:
  run: # 单次运行 (包括 use_optuna=false 或未使用 --multirun 时)
    dir: "." # 设置为点，让 get_output_dir 完全控制
  sweep: # --multirun 运行 (当 use_optuna=true 时)
    dir: ./logs/${project_name}/${model.model_name}/optuna_sweep/${now:%Y-%m-%d_%H-%M-%S}
    subdir: trial_${hydra.job.num} # 每个Optuna trial一个子目录，命名更清晰
  job_logging: # 控制Hydra自身的日志级别
    root:
      level: INFO
  output_subdir: .hydra # Hydra自身配置和日志的子目录

# Optuna 配置 (如果使用 use_optuna=true 运行)
use_optuna: false # 是否执行Optuna超参数搜索
optuna_trials: 20
optuna_study_name: "${model.model_name}_study_${now:%Y%m%d_%H%M%S}"
optuna_storage: "sqlite:///./logs/${project_name}/optuna_studies/${optuna_study_name}.db" # 研究结果会更清晰 