# conf/config.yaml
defaults:
  - model: tecGPT        # 默认模型
  - dataset: tec_data_v1 # 默认数据集配置
  - trainer: default     # 默认训练器配置
  - sweeper: basic_optuna # 默认Optuna配置 (如果使用)
  - _self_ # 允许在此文件中直接定义参数

# 实验全局参数
project_name: "tecGPT-forecasting"
run_name: "default_run_${now:%Y-%m-%d_%H-%M-%S}" # Hydra的插值功能，自动生成带时间戳的运行名称
seed: 42
device: "cuda" # 全局设备设置

# 工作目录设置 (Hydra会自动创建输出目录)
hydra:
  run:
    dir: ./logs/${project_name}/${model.model_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./logs/${project_name}/${model.model_name}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

# W&B 配置
wandb:
  enable: true # 是否启用W&B
  project: ${project_name} # 使用上面定义的project_name
  entity: null # 你的W&B实体 (用户名或团队名)
  group: ${model.model_name}_runs # 按模型名称分组实验

# Optuna 配置 (如果使用 use_optuna=true 运行)
use_optuna: false # 是否执行Optuna超参数搜索
optuna_trials: 20
optuna_study_name: "${model.model_name}_study_${now:%Y%m%d_%H%M%S}"
optuna_storage: "sqlite:///./logs/${project_name}/optuna_studies.db" # Optuna数据库路径 