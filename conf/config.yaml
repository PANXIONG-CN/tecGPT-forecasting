defaults:
  - data: default
  - model: tec_gpt
  - trainer: default
  - hydra: default # For basic hydra settings like run dir, sweep dir
  - override hydra/job_logging: default # Logging for individual jobs
  - override hydra/launcher: basic # Can be changed for slurm, etc.
  # - _self_ # Include current config file settings

# General experiment settings
project_name: "tecGPT-forecasting"
version: "0.1.0"
seed: 42
deterministic: False # if True, set CUDNN to deterministic, can slow down
verbose: True

# Paths (can be absolute or relative to original working directory if not overridden)
# These might be better placed under data config or accessed via oc.env
# data_root_dir: /path/to/your/datasets/
# raw_data_dir: ${data_root_dir}/hdf5_files/
# processed_data_dir: ./processed_data/ # Or relative to hydra output if desired

# Wandb settings
wandb:
  entity: "" # Your wandb entity (username or team)
  project: ${project_name} # Use project_name defined above
  # name: null # Will be generated by hydra/wandb by default
  log_model: True # "all", True, False
  # mode: "online" # "disabled", "offline", "online"
  # tags: ["tec", "gpt", "forecasting"]

# Checkpointing - often part of trainer config
# checkpoint:
#   monitor: "val/loss"
#   mode: "min"
#   save_top_k: 1
#   save_last: True
#   dirpath: "checkpoints/" # Relative to hydra run directory
#   filename: "epoch_{epoch:02d}-val_loss_{val/loss:.2f}"

# Other global settings if any
# e.g. num_workers for dataloaders, pin_memory, etc.
# These can also be part of data or trainer configs.
num_workers: 4
pin_memory: True

# This is a placeholder for main script execution.
# Often, you don't need a target here if you are calling train.py, evaluate.py directly.
# Or you might have a main function in one of those scripts.
# main_script:
#   _target_: src.train.main # Example if train.py has a main function

# Note: Hydra automatically populates hydra.run.dir, hydra.sweep.dir etc.
# You can use these in your paths, e.g., processed_data_dir: ${hydra:runtime.cwd}/processed_data
# if you want paths relative to where you launched the script.
# Or output_subdir: ${hydra.output_subdir} for configuring job logging. 