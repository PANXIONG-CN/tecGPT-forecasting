_target_: src.datasets.tec_dataset.TECDataModule

# Paths
# These assume HDF5 files are outside the project repo or in a specific location.
# Paths for the raw HDF5 files, can be a list of files or a directory pattern.
# This information will be used by preprocess_hdf5.py
# It's not directly used by TECDataModule, but good to keep data-related paths here.
raw_data_dir: /path/to/your/hdf5_data # Example: /mnt/data/tec_data/
# This could be a list of years for preprocess_hdf5.py
# train_years: [2013, 2014, 2015, 2016, 2017, 2018, 2019]
# val_years: [2020, 2021]
# test_years: [2022, 2023, 2024, 2025] # Up to 2025.4 implies partial 2025

# Path to where preprocess_hdf5.py will save .npz files and scaler.pkl
# TECDataModule will load from here.
processed_data_dir: ./processed_data # This could be relative to hydra run dir if generated per run, or a fixed shared path.
# Example if it's a fixed path:
# processed_data_dir: ${oc.env:PWD}/processed_data # Or an absolute path

scaler_filename: scaler.pkl # Name of the scaler file within processed_data_dir

train_file: train.npz
val_file: val.npz
test_file: test.npz

# Sliding window parameters
p_history: 12 # Number of historical time steps (e.g., 12 steps * 2h/step = 24h)
s_forecast: 6  # Number of future time steps to predict (e.g., 6 steps * 2h/step = 12h)

# DataLoader parameters
batch_size: 32
num_workers: ${num_workers} # Referencing from main config
pin_memory: ${pin_memory}   # Referencing from main config
shuffle_train: True
shuffle_val: False
shuffle_test: False

# TEC map dimensions (used for N_nodes calculation, and potentially in model)
n_lat: 41
n_lon: 71
# N_nodes will be n_lat * n_lon = 2911

# Input features C_in (used for validation, maybe in model head if dynamic)
# This should match the output of preprocess_hdf5.py
# 1 (TEC) + 5 (SW) + 6 (Time) = 12
c_in: 12 