_target_: src.trainers.tec_trainer.TecTrainer

# Training parameters
epochs: 100
learning_rate: 1e-4
weight_decay: 1e-5
optimizer_name: "AdamW" # "Adam", "RMSprop", etc.
# optimizer_params: {} # Additional params for optimizer like betas for Adam, eps

# Scheduler (optional)
lr_scheduler_name: "ReduceLROnPlateau" # "CosineAnnealingLR", "StepLR", null
lr_scheduler_params: # Specific to scheduler
  monitor: "val/loss" # For ReduceLROnPlateau
  mode: "min"
  factor: 0.1
  patience: 10
  # T_max: ${..epochs} # For CosineAnnealingLR

# Gradient clipping (optional)
gradient_clip_val: 1.0 # null or a float value

# Loss function
criterion_name: "MSELoss" # or "L1Loss" (MAE)
# criterion_params: {}

# Early stopping (optional)
early_stopping:
  monitor: "val/loss"
  mode: "min"
  patience: 20 # Number of epochs with no improvement after which training will be stopped.
  min_delta: 0.0001 # Minimum change in the monitored quantity to qualify as an improvement.

# Checkpointing (managed by the trainer or a callback system like PyTorch Lightning)
# For a custom trainer, you'd implement this logic.
# These are more like PL-style checkpoint args.
checkpoint_dir: "checkpoints" # Relative to hydra run directory
checkpoint_monitor: "val/loss"
checkpoint_mode: "min"
checkpoint_save_top_k: 1
checkpoint_save_last: True
checkpoint_filename_prefix: "tecllm" # e.g., tecllm-epoch=XX-val_loss=YY.ckpt

# Logging frequency
log_every_n_steps: 50 # For training steps

# Device
# device: "cuda" # "cpu", "cuda", "cuda:0" etc.
# device: "auto" # Trainer can try to auto-detect

# For evaluation
# metrics_to_compute: ["MAE", "RMSE", "WMAPE", "R2"] # Defined in utils.metrics

# If using PyTorch Lightning or a similar framework, this config would be different.
# For a custom trainer, these are parameters your TecTrainer class will use. 