# @package hydra.job_logging
# Copied from hydra-core/hydra/conf/hydra/job_logging/default.yaml
# and potentially customized if needed.

version: 1

formatters:
  simple:
    format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'

handlers:
  console:
    class: hydra.logging.HydraConsoleHandler
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    formatter: simple
    # filename: auto-configured by Hydra to be ${hydra.runtime.output_dir}/${hydra.job.name}.log
    # encoding: utf-8

root:
  level: INFO
  handlers:
    - console
    - file

disable_existing_loggers: false 